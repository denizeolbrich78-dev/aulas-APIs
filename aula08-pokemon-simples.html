<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Pokémon - Versão Simples</title>
</head>
<body>
    <h1>Detalhes do Pokémon</h1>
    
    <img id="poke-sprite" src="" alt="Imagem do Pokémon" width="150">
    <p><strong>ID:</strong> <span id="poke-id">Carregando...</span></p>
    <p><strong>Nome:</strong> <span id="poke-nome">Carregando...</span></p>
    <p><strong>Tipo:</strong> <span id="poke-tipo">Carregando...</span></p>
    <p><strong>classe:</strong> <span id="poke-tipo">Carregando...</span></p>
    <p><strong>altura:</strong> <span id="poke-tipo">Carregando...</span></p>
    <p><strong>regiao:</strong> <span id="poke-tipo">Carregando...</span></p>
    <p><strong>peso:</strong> <span id="poke-tipo">Carregando...</span></p>

    <script>
        // Variáveis globais
        let pokemonId;
        let pokemonNome;
        let pokemonTipo;
        let pokemonUrlSprite;
        let pokemonClasse;
        let pokemonAltura;
        let pokemonRegiao;
        let pokemonPeso;

        fetch('https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/4')
            .then(response => response.json())
            .then(data => {
                pokemonId = data.id;
                pokemonNome = data.nome; 
                pokemonTipo = data.tipo_primario; 
                pokemonUrlSprite = data.url_sprite;
                pokemonClasse = data.classe; 
                pokemonAltura = data.altura;
                pokemonRegiao = data.regiao;
                pokemonpeso = data.peso;

                // Colocando os resultados das variáveis nas tags de texto e imagem do HTML
                document.getElementById('poke-id').innerText = pokemonId;
                document.getElementById('poke-nome').innerText = pokemonNome;
                document.getElementById('poke-tipo').innerText = pokemonTipo;
                document.getElementById('poke-sprite').src = pokemonUrlSprite;
            })
            .catch(error => console.error("Erro ao buscar os dados da API: ", error));
    </script>
</body>
</html>
