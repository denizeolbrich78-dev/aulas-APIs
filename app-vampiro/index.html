<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil Vampiro</title>
</head>

<body>
    <h1>Perfil Vampiro</h1>
    <img src="" alt="" id="foto-vamp">
    <p id="nome-vamp"></p>
    <p id="cla-vamp"></p>
    <p id="status-vamp"></p>
</body>
<script>
    const vampireId = 1;
    fetch(`http://localhost:8080/api/v1/vampiros/` + vampireId)
        .then(response => response.json())
        .then(data => {
            document.getElementById("nome-vamp").innerText = data.nome
            document.getElementById("status-vamp").innerText = data.status
            document.getElementById("cla-vamp").innerText = data.cla
            document.getElementById("foto-vamp").src = data.foto_perfil
        })
</script>

</html>
